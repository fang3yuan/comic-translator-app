name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: pip install -r requirements.txt pytest
      - run: xvfb-run -a pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, archive: "dist/ComicTranslator-windows.zip" }
          - { os: macos-latest, name: macos, archive: "dist/ComicTranslator-macos.tar.gz" }
          - { os: ubuntu-latest, name: linux, archive: "dist/ComicTranslator-linux.tar.gz" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller comic_translator.spec --noconfirm --clean
      - name: Archive (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/ComicTranslator -DestinationPath dist/ComicTranslator-windows.zip
      - name: Setup.exe installer (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss
      - name: Archive (macOS/Linux)
        if: matrix.name != 'windows'
        run: tar -czf dist/ComicTranslator-${{ matrix.name }}.tar.gz -C dist ComicTranslator
      - uses: actions/upload-artifact@v4
        with:
          name: ComicTranslator-${{ matrix.name }}
          path: |
            ${{ matrix.archive }}
            dist/ComicTranslator-Setup.exe
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
